<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Game API developer dashboard"><title>Game API • Profile</title><link rel="stylesheet" href="./assets/css/app.css?v=20260923.4"></head><body><div id="app"></div><script src="./assets/js/app.js?v=20260923.12"></script><style>
.profile-fallback{display:none;min-height:100vh;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 80% 0%,rgba(60,110,255,.18),transparent 35%),#070b16;color:#f5f7ff;font-family:Inter,system-ui,sans-serif}.profile-fallback.show{display:block}.pf-wrap{max-width:1050px;margin:0 auto}.pf-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.pf-top a,.pf-btn{color:inherit;text-decoration:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);padding:10px 14px;border-radius:10px;cursor:pointer}.pf-card{background:rgba(17,23,39,.88);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.pf-hero{display:flex;align-items:center;gap:18px;margin-bottom:18px}.pf-avatar{width:78px;height:78px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#20335f;font-size:28px;font-weight:800;overflow:hidden}.pf-avatar img{width:100%;height:100%;object-fit:cover}.pf-hero h1{margin:0 0 5px;font-size:26px}.pf-hero p{margin:0;opacity:.65}.pf-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.pf-form{display:grid;gap:14px}.pf-form label{display:grid;gap:7px;font-size:11px;font-weight:800;letter-spacing:.08em}.pf-form input{box-sizing:border-box;width:100%;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:#0c1120;color:inherit;font:inherit}.pf-form input:focus{outline:none;border-color:#5c82ff}.pf-form input[readonly]{opacity:.6}.pf-actions{display:flex;justify-content:flex-end;gap:9px}.pf-details{display:grid}.pf-details div{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}.pf-details span{display:block;font-size:9px;opacity:.5;margin-bottom:4px}.pf-details b,.pf-details code{font-size:12px;overflow-wrap:anywhere}.pf-status{font-size:12px;opacity:.65}.pf-ok{color:#59d99d;opacity:1}@media(max-width:800px){.pf-grid{grid-template-columns:1fr}.profile-fallback{padding:15px}}
</style><div class="profile-fallback" id="profile-fallback"><div class="pf-wrap"><div class="pf-top"><b>Game API · My Profile</b><a href="dashboard.html">← Dashboard</a></div><div class="pf-card pf-hero"><div class="pf-avatar" id="pf-avatar">D</div><div><h1 id="pf-name">Developer</h1><p id="pf-email">Loading account…</p></div></div><div class="pf-grid"><div class="pf-card"><h3>Personal information</h3><p class="pf-status" id="pf-status">Loading your account…</p><form class="pf-form" id="pf-form"><label>DISPLAY NAME<input id="pf-name-input" maxlength="120"></label><label>EMAIL ADDRESS<input id="pf-email-input" readonly></label><label>PROFILE PHOTO URL<input id="pf-avatar-input" type="url" maxlength="500" placeholder="https://…"></label><div class="pf-actions"><button class="pf-btn" type="button" id="pf-reset">Reset</button><button class="pf-btn" type="submit">Save profile</button></div></form></div><div class="pf-card"><h3>Account details</h3><div class="pf-details"><div><span>USER ID</span><code id="pf-id">—</code></div><div><span>AUTH PROVIDER</span><b id="pf-provider">—</b></div><div><span>ACCOUNT CREATED</span><b id="pf-created">—</b></div><div><span>EMAIL STATUS</span><b id="pf-verified">—</b></div></div></div></div></div></div><script type="module">
const fallback=document.getElementById("profile-fallback");
setTimeout(()=>{if(!document.querySelector(".app-shell"))fallback.classList.add("show")},900);
try{
 const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2.105.0");
 const sb=createClient("https://qbagxeqquskkjksoraiz.supabase.co","sb_publishable_chfRxHSFPSA1SZJtBajtKA_I7vs8R--",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data}=await sb.auth.getSession(); const session=data?.session;
 if(!session){location.replace("login.html");} else {
  fallback.classList.add("show"); const user=session.user||{},m=user.user_metadata||{},p=user.app_metadata?.provider||"email"; const name=m.full_name||m.name||m.user_name||m.preferred_username||(user.email||"").split("@")[0]||"Developer"; const avatar=m.avatar_url||m.picture||"";
  const $=id=>document.getElementById(id); $("pf-name").textContent=name;$("pf-email").textContent=user.email||"";$("pf-name-input").value=name;$("pf-email-input").value=user.email||"";$("pf-avatar-input").value=avatar;$("pf-id").textContent=user.id||"—";$("pf-provider").textContent=p;$("pf-created").textContent=user.created_at?new Date(user.created_at).toLocaleString():"—";$("pf-verified").textContent=user.email_confirmed_at?"Verified":"Not verified";$("pf-status").textContent="Profile loaded";$("pf-status").classList.add("pf-ok");
  const renderAvatar=()=>{const url=$("pf-avatar-input").value.trim(),n=$("pf-name-input").value.trim()||"Developer",el=$("pf-avatar");el.innerHTML=url?"<img src=\""+url.replace(/"/g,"&quot;")+"\" alt=\"Profile photo\">":n.charAt(0).toUpperCase();$("pf-name").textContent=n;$("pf-email").textContent=user.email||""};renderAvatar();$("pf-name-input").oninput=renderAvatar;$("pf-avatar-input").oninput=renderAvatar;
  $("pf-reset").onclick=()=>{ $("pf-name-input").value=name;$("pf-avatar-input").value=avatar;renderAvatar();$("pf-status").textContent="Reset";};
  $("pf-form").onsubmit=async e=>{e.preventDefault();const n=$("pf-name-input").value.trim(),u=$("pf-avatar-input").value.trim();if(!n)return;$("pf-status").textContent="Saving…";const r=await sb.auth.updateUser({data:{full_name:n,avatar_url:u}});if(r.error){$("pf-status").textContent=r.error.message;$("pf-status").classList.remove("pf-ok");return}localStorage.setItem("gameapi_user",JSON.stringify({name:n,email:user.email||"",id:user.id||"",avatar:u}));$("pf-status").textContent="Profile saved successfully";$("pf-status").classList.add("pf-ok");name=n;avatar=u;renderAvatar()};
 }
}catch(e){fallback.classList.add("show");document.getElementById("pf-status").textContent="Unable to connect to your account: "+e.message}
</script></body></html>
