<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Game API • Completing sign in</title>
<link rel="stylesheet" href="./assets/css/app.css?v=20260923">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0f172a;background:#f7f9fc}.callback-page{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;background:#0b1220}.callback-page:before,.callback-page:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.callback-page:before{width:650px;height:650px;top:-360px;left:-220px;background:radial-gradient(circle,rgba(37,99,235,.55),transparent 68%)}.callback-page:after{width:700px;height:700px;right:-330px;bottom:-420px;background:radial-gradient(circle,rgba(124,58,237,.42),transparent 68%)}.grid{position:absolute;inset:0;opacity:.1;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:42px 42px}.callback-wrap{position:relative;z-index:1;width:min(430px,calc(100% - 36px));text-align:center}.brand{display:flex;justify-content:center;align-items:center;gap:11px;margin-bottom:25px;color:#fff}.brand-mark{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:19px;font-weight:900;box-shadow:0 14px 35px #2563eb55}.brand-name{text-align:left;font-size:16px;font-weight:800}.brand-name small{display:block;color:#94a3b8;font-size:8px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}.callback-card{padding:38px 32px;border:1px solid #ffffff18;border-radius:24px;background:rgba(255,255,255,.97);box-shadow:0 30px 90px rgba(0,0,0,.28)}.callback-icon{width:62px;height:62px;margin:0 auto 20px;display:grid;place-items:center;border-radius:18px;background:#eff6ff;color:#2563eb}.callback-icon svg{width:29px;height:29px}.callback-card h1{margin:0 0 8px;font-size:24px;letter-spacing:-.04em}.callback-card p{margin:0;color:#64748b;font-size:11px;line-height:1.7}.callback-spinner{width:31px;height:31px;margin:23px auto 5px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}.secure{margin-top:20px;color:#94a3b8;font-size:9px}.secure span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:6px}.callback-error{display:none;margin-top:17px;padding:12px;border-radius:11px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:10px;line-height:1.55}.callback-error.show{display:block}.callback-link{display:none;margin-top:14px;padding:10px 16px;border-radius:9px;background:#2563eb;color:#fff;text-decoration:none;font-size:10px;font-weight:800}.callback-link.show{display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:520px){.callback-card{padding:30px 22px}}
</style>
</head>
<body>
<main class="callback-page"><div class="grid"></div><div class="callback-wrap"><div class="brand"><div class="brand-mark">G</div><div class="brand-name">Game API<small>Developer Console</small></div></div><section class="callback-card"><div class="callback-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7 10 17l-5-5"/><path d="M20 12a8 8 0 1 1-3.3-6.5"/></svg></div><h1>Completing your sign in</h1><p id="status">Securing your developer session…</p><div class="callback-spinner" id="spinner"></div><div class="callback-error" id="error"></div><a class="callback-link" id="back" href="login.html">Return to sign in</a><div class="secure"><span></span>Secure authentication enabled</div></section></div></main><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.105.0";

const SUPABASE_URL="https://qbagxeqquskkjksoraiz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_chfRxHSFPSA1SZJtBajtKA_I7vs8R--";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}
});

const statusEl=document.getElementById("status");
const spinner=document.getElementById("spinner");
const errorEl=document.getElementById("error");
const back=document.getElementById("back");

try{
  const params=new URLSearchParams(location.search);
  const code=params.get("code");
  const authError=params.get("error_description")||params.get("error");

  if(authError) throw new Error(decodeURIComponent(authError));

  if(code) throw new Error("Unexpected authorization code. Please restart Google sign-in.");

  const{data,error}=await supabase.auth.getSession();
  if(error) throw error;
  if(!data.session) throw new Error("No authenticated session was found.");

  statusEl.textContent="Sign in successful. Opening your dashboard…";
  setTimeout(()=>location.replace("dashboard.html"),250);
}catch(error){
  spinner.style.display="none";
  statusEl.textContent="We could not complete your sign in.";
  errorEl.textContent=error.message||"Authentication callback failed.";
  errorEl.classList.add("show");
  back.classList.add("show");
}
</script>
</body>
</html>
