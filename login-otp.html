<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Game API • Email OTP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220}.page{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}.page:before,.page:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.page:before{width:650px;height:650px;top:-360px;left:-220px;background:radial-gradient(circle,rgba(37,99,235,.55),transparent 68%)}.page:after{width:700px;height:700px;right:-330px;bottom:-420px;background:radial-gradient(circle,rgba(124,58,237,.42),transparent 68%)}.wrap{position:relative;z-index:1;width:min(430px,100%)}.brand{display:flex;justify-content:center;align-items:center;gap:11px;color:#fff;margin-bottom:24px}.mark{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#2563eb,#7c3aed);font-weight:900}.brand small{display:block;color:#94a3b8;font-size:8px;letter-spacing:.12em;text-transform:uppercase}.card{padding:34px 30px;border:1px solid #ffffff18;border-radius:24px;background:#fff;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.28)}.icon{width:60px;height:60px;margin:0 auto 18px;display:grid;place-items:center;border-radius:17px;background:#eff6ff;color:#2563eb;font-size:25px}.card h1{margin:0 0 8px;font-size:25px}.card p{margin:0;color:#64748b;font-size:11px;line-height:1.7}.email{font-weight:800;color:#2563eb}.code{width:100%;height:58px;margin-top:22px;border:1px solid #cbd5e1;border-radius:12px;text-align:center;letter-spacing:.42em;font-size:24px;font-weight:800;outline:0}.btn{width:100%;height:48px;margin-top:12px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.msg{min-height:22px;margin-top:13px;color:#b91c1c;font-size:10px}.back{display:inline-block;margin-top:10px;color:#64748b;font-size:9px;text-decoration:none}
</style></head><body><main class="page"><div class="wrap"><div class="brand"><div class="mark">G</div><div><b>Game API</b><small>Developer Console</small></div></div><section class="card"><div class="icon">✉</div><h1>Enter email OTP</h1><p>Enter the 6-digit code sent to <span id="email" class="email"></span>.</p><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"><button id="verify" class="btn" type="button">Verify and continue</button><div id="msg" class="msg"></div><a class="back" href="login.html">Back to sign in</a></section></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.105.0";
const sb=createClient("https://qbagxeqquskkjksoraiz.supabase.co","sb_publishable_chfRxHSFPSA1SZJtBajtKA_I7vs8R--",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const email=new URLSearchParams(location.search).get("email")||"";document.getElementById("email").textContent=email||"your email";
const code=document.getElementById("code"),btn=document.getElementById("verify"),msg=document.getElementById("msg");function message(t){msg.textContent=t}
async function submit(){const token=code.value.replace(/D/g,"");if(!email){message("No email address was provided.");return}if(token.length!==6){message("Enter the 6-digit code.");return}btn.disabled=true;btn.textContent="Verifying…";try{const r=await sb.auth.verifyOtp({email,token,type:"email"});if(r.error)throw r.error;if(!r.data?.session)throw new Error("The OTP was accepted but no session was created.");const aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.error)throw aal.error;location.replace(aal.data?.currentLevel==="aal1"&&aal.data?.nextLevel==="aal2"?"entertotp.html":"dashboard.html")}catch(e){message(e.message||"Invalid or expired OTP.");code.select()}finally{btn.disabled=false;btn.textContent="Verify and continue"}}
code.addEventListener("input",()=>{code.value=code.value.replace(/D/g,"").slice(0,6);if(code.value.length===6)submit()});btn.onclick=submit;
</script></body></html>
