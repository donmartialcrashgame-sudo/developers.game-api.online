<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Game API • Verify TOTP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#0f172a}.page{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}.page:before,.page:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.page:before{width:650px;height:650px;top:-360px;left:-220px;background:radial-gradient(circle,rgba(37,99,235,.55),transparent 68%)}.page:after{width:700px;height:700px;right:-330px;bottom:-420px;background:radial-gradient(circle,rgba(124,58,237,.42),transparent 68%)}.grid{position:absolute;inset:0;opacity:.1;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:42px 42px}.wrap{position:relative;z-index:1;width:min(430px,100%)}.brand{display:flex;justify-content:center;align-items:center;gap:11px;color:#fff;margin-bottom:24px}.mark{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#2563eb,#7c3aed);font-weight:900}.brand b{font-size:16px}.brand small{display:block;color:#94a3b8;font-size:8px;letter-spacing:.12em;text-transform:uppercase}.card{padding:34px 30px;border:1px solid #ffffff18;border-radius:24px;background:rgba(255,255,255,.97);box-shadow:0 30px 90px rgba(0,0,0,.28);text-align:center}.icon{width:60px;height:60px;margin:0 auto 18px;display:grid;place-items:center;border-radius:17px;background:#eff6ff;color:#2563eb;font-size:25px}.card h1{margin:0 0 8px;font-size:25px;letter-spacing:-.04em}.card p{margin:0;color:#64748b;font-size:11px;line-height:1.7}.code{width:100%;height:58px;margin-top:22px;border:1px solid #cbd5e1;border-radius:12px;text-align:center;letter-spacing:.42em;font-size:24px;font-weight:800;outline:0}.code:focus{border-color:#2563eb;box-shadow:0 0 0 4px #2563eb12}.btn{width:100%;height:48px;margin-top:12px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:22px;margin-top:13px;color:#b91c1c;font-size:10px}.back{display:inline-block;margin-top:10px;color:#64748b;font-size:9px;text-decoration:none}.secure{margin-top:18px;color:#94a3b8;font-size:9px}.secure i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:6px}
</style></head><body><main class="page"><div class="grid"></div><div class="wrap"><div class="brand"><div class="mark">G</div><div><b>Game API</b><small>Developer Console</small></div></div><section class="card"><div class="icon">⌁</div><h1>Enter your authenticator code</h1><p>Your account has TOTP enabled. Enter the current 6-digit code from your authenticator app before entering the developer console.</p><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="TOTP code"><button id="verify" class="btn" type="button">Verify and continue</button><div id="msg" class="msg"></div><a class="back" href="login.html">Back to sign in</a><div class="secure"><i></i>Two-factor authentication required</div></section></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.105.0";
const sb=createClient("https://qbagxeqquskkjksoraiz.supabase.co","sb_publishable_chfRxHSFPSA1SZJtBajtKA_I7vs8R--",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const code=document.getElementById("code"),verify=document.getElementById("verify"),msg=document.getElementById("msg");
function message(t){msg.textContent=t}
async function start(){
  const s=await sb.auth.getSession();
  if(!s.data?.session){location.replace("login.html");return}
  const aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal.error){message(aal.error.message);return}
  if(aal.data?.currentLevel==="aal2"){location.replace("dashboard.html");return}
  const factors=await sb.auth.mfa.listFactors();
  if(factors.error){message(factors.error.message);return}
  const factor=(factors.data?.totp||[]).find(f=>f.status==="verified");
  if(!factor){location.replace("dashboard.html");return}
  window.totpFactorId=factor.id;
  const challenge=await sb.auth.mfa.challenge({factorId:factor.id});
  if(challenge.error){message(challenge.error.message);return}
  window.totpChallengeId=challenge.data.id;
}
async function submit(){
  const token=code.value.replace(/D/g,"");
  if(token.length!==6){message("Enter the 6-digit code from your authenticator app.");return}
  if(!window.totpFactorId||!window.totpChallengeId){message("The verification session is not ready. Please reload.");return}
  verify.disabled=true;verify.textContent="Verifying…";message("");
  try{
    const result=await sb.auth.mfa.verify({factorId:window.totpFactorId,challengeId:window.totpChallengeId,code:token});
    if(result.error)throw result.error;
    const aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal.error)throw aal.error;
    if(aal.data?.currentLevel!=="aal2")throw new Error("TOTP was accepted but the session was not upgraded to AAL2.");
    location.replace("dashboard.html");
  }catch(e){message(e.message||"Invalid authenticator code.");code.select();}
  finally{verify.disabled=false;verify.textContent="Verify and continue";}
}
code.addEventListener("input",()=>{code.value=code.value.replace(/D/g,"").slice(0,6);if(code.value.length===6)submit()});
verify.onclick=submit;start();
</script></body></html>
